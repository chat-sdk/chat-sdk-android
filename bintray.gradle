tasks.register("androidSourcesJar", Jar) {
    archiveClassifier.set("sources")
    from android.sourceSets.main.java.srcDirs
}


afterEvaluate {

    tasks.matching { it.name == "greendao" }.configureEach { greendaoTask ->
        tasks.named("androidSourcesJar").configure {
            dependsOn(greendaoTask)
        }
    }

    if (project.plugins.hasPlugin('com.android.library')) {
        publishing {
            publications {
                release(MavenPublication) {
                    from components.findByName('release')

//                    def bundleTask = tasks.findByName("bundleReleaseAar")
//                    if (bundleTask) {
//                        // MavenPublish needs the specific file location
//                        artifact(bundleTask.archiveFile) {
//                            // Ensure the task runs before publishing
//                            builtBy(bundleTask)
//                        }
//                    } else {
//                        logger.error("Could not find bundleReleaseAar task.")
//                    }

                    // 3. Force packaging to 'aar' (Just in case the component defaults to 'pom')
                    pom.packaging = 'aar'

                    // 3. Optional: Attach Sources JAR (if you want them)
                    // You can manually define this task if the component isn't doing it
//                    task androidSourcesJar(type: Jar) {
//                        archiveClassifier.set('sources')
//                        from android.sourceSets.main.java.srcDirs
//                    }
//                    artifact(androidSourcesJar)

                    artifact(tasks.named("androidSourcesJar"))

                    groupId = group
                    artifactId = artifact
                    version = version

                    // Include the generated POM file
                    pom {
                        name ='Chat SDK'
                        description = 'Open Source Instant Messaging Framework'
                        url = 'https://github.com/chat-sdk/chat-sdk-android'
                        licenses {
                            license {
                                name = 'Dual licensing: GPL or Commercial / Apache 2.0'
                                url = 'https://github.com/chat-sdk/chat-sdk-android/blob/master/LICENSE.md'
                            }
                        }
                        developers {
                            developer {
                                id = '100bears'
                                name = 'Benjamin Smiley-Andrews'
                                email = 'ben@sdk.chat'
                            }
                        }
                        scm {
                            connection = 'scm:git:git@github.com:chat-sdk/chat-sdk-android.git'
                            developerConnection = 'scm:git:ssh://github.com:chat-sdk/chat-sdk-android.git'
                            url = 'https://github.com/chat-sdk/chat-sdk-android'
                        }
                    }
                }
            }
            repositories {
